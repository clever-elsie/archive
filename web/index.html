<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>HOME-SERVER</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
	<style>
		/* リセットとベーススタイル */
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
			color: #ffffff;
			font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			line-height: 1.6;
			min-height: 100vh;
			overflow-x: hidden;
		}

		/* ヘッダー */
		.header {
			background: rgba(255, 255, 255, 0.05);
			backdrop-filter: blur(20px);
			border-bottom: 1px solid rgba(255, 255, 255, 0.1);
			position: sticky;
			top: 0;
			z-index: 1000;
			padding: 1rem 0;
		}

		.header-content {
			max-width: 1200px;
			margin: 0 auto;
			padding: 0 2rem;
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		.home-link {
			display: flex;
			align-items: center;
			gap: 0.5rem;
			color: #64ffda;
			text-decoration: none;
			font-weight: 600;
			font-size: 1.2rem;
			transition: all 0.3s ease;
		}

		.home-link:hover {
			color: #00d4aa;
			transform: translateY(-2px);
		}

		.header-info {
			text-align: right;
		}

		.title {
			font-size: 1.5rem;
			font-weight: 600;
			color: #ffffff;
			margin-bottom: 0.25rem;
		}

		.counter {
			font-size: 1rem;
			color: #8892b0;
			font-weight: 400;
		}

		/* ハンバーガーメニュー */
		.hamburger-menu {
			position: relative;
			display: none;
		}

		.hamburger-btn {
			background: none;
			border: none;
			color: #64ffda;
			font-size: 1.5rem;
			cursor: pointer;
			padding: 0.5rem;
			border-radius: 8px;
			transition: all 0.3s ease;
		}

		.hamburger-btn:hover {
			background: rgba(100, 255, 218, 0.1);
			transform: translateY(-2px);
		}

		.hamburger-content {
			position: absolute;
			top: 100%;
			right: 0;
			background: rgba(255, 255, 255, 0.05);
			backdrop-filter: blur(20px);
			border: 1px solid rgba(255, 255, 255, 0.1);
			border-radius: 12px;
			padding: 1rem;
			min-width: 200px;
			box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
			opacity: 0;
			visibility: hidden;
			transform: translateY(-10px);
			transition: all 0.3s ease;
		}

		.hamburger-content.show {
			opacity: 1;
			visibility: visible;
			transform: translateY(0);
		}

		.hamburger-item {
			display: block;
			padding: 0.75rem 1rem;
			color: #ffffff;
			text-decoration: none;
			border-radius: 8px;
			transition: all 0.3s ease;
			margin-bottom: 0.5rem;
		}

		.hamburger-item:hover {
			background: rgba(255, 255, 255, 0.1);
			color: #64ffda;
		}

		.hamburger-item:last-child {
			margin-bottom: 0;
		}

		.hamburger-item.logout {
			color: #ff6b6b;
		}

		.hamburger-item.logout:hover {
			background: rgba(255, 107, 107, 0.1);
			color: #ff5252;
		}

		/* メインコンテンツ */
		.main-content {
			max-width: 1200px;
			margin: 0 auto;
			padding: 2rem;
		}

		/* ログインフォーム */
		.login-section {
			display: flex;
			justify-content: center;
			align-items: center;
			min-height: calc(100vh - 100px);
		}

		.login-card {
			background: rgba(255, 255, 255, 0.05);
			border-radius: 16px;
			padding: 3rem;
			border: 1px solid rgba(255, 255, 255, 0.1);
			backdrop-filter: blur(10px);
			transition: all 0.3s ease;
			max-width: 400px;
			width: 100%;
		}

		.login-card:hover {
			transform: translateY(-4px);
			box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
		}

		.login-card h2 {
			font-size: 1.8rem;
			font-weight: 600;
			color: #64ffda;
			margin-bottom: 2rem;
			text-align: center;
		}

		.input-group {
			margin-bottom: 1.5rem;
		}

		.input-group label {
			display: block;
			margin-bottom: 0.5rem;
			color: #8892b0;
			font-size: 0.9rem;
			font-weight: 500;
		}

		.modern-input {
			width: 100%;
			padding: 0.75rem 1rem;
			border: 1px solid rgba(255, 255, 255, 0.2);
			border-radius: 8px;
			background: rgba(255, 255, 255, 0.05);
			color: #ffffff;
			font-size: 1rem;
			transition: all 0.3s ease;
		}

		.modern-input:focus {
			outline: none;
			border-color: #64ffda;
			box-shadow: 0 0 0 3px rgba(100, 255, 218, 0.1);
		}

		.modern-input::placeholder {
			color: #8892b0;
		}

		/* ボタンスタイル */
		.btn {
			padding: 0.75rem 1.5rem;
			border: none;
			border-radius: 8px;
			font-size: 1rem;
			font-weight: 500;
			cursor: pointer;
			transition: all 0.3s ease;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 0.5rem;
			text-decoration: none;
			color: #ffffff;
			min-height: 48px;
			width: 100%;
		}

		.btn:hover {
			transform: translateY(-2px);
			box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
		}

		.btn:active {
			transform: translateY(0);
			box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
		}

		.btn-primary {
			background: linear-gradient(135deg, #64ffda 0%, #00d4aa 100%);
			color: #0f0f23;
		}

		.btn-primary:hover {
			background: linear-gradient(135deg, #00d4aa 0%, #64ffda 100%);
		}

		/* メインコンテンツ表示 */
		.main-display {
			display: none;
		}

		.welcome-section {
			margin-bottom: 3rem;
		}

		.welcome-card {
			background: rgba(255, 255, 255, 0.05);
			border-radius: 16px;
			padding: 2rem;
			border: 1px solid rgba(255, 255, 255, 0.1);
			backdrop-filter: blur(10px);
			transition: all 0.3s ease;
		}

		.welcome-card:hover {
			transform: translateY(-4px);
			box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
		}

		.welcome-card h2 {
			font-size: 1.8rem;
			font-weight: 600;
			color: #64ffda;
			margin-bottom: 1rem;
		}

		.welcome-card p {
			color: #8892b0;
			font-size: 1rem;
			line-height: 1.6;
		}

		/* メニューグリッド */
		.menu-section {
			margin-bottom: 3rem;
		}

		.menu-grid {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
			gap: 2rem;
		}

		.menu-card {
			background: rgba(255, 255, 255, 0.05);
			border-radius: 16px;
			padding: 2rem;
			border: 1px solid rgba(255, 255, 255, 0.1);
			backdrop-filter: blur(10px);
			transition: all 0.3s ease;
			text-decoration: none;
			color: #ffffff;
			display: block;
		}

		.menu-card:hover {
			transform: translateY(-4px);
			box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
			color: #64ffda;
		}

		.menu-card h3 {
			font-size: 1.5rem;
			font-weight: 600;
			margin-bottom: 1rem;
			display: flex;
			align-items: center;
			gap: 0.5rem;
		}

		.menu-card p {
			color: #8892b0;
			font-size: 1rem;
			line-height: 1.6;
		}

		/* メッセージ */
		.message {
			padding: 1rem;
			border-radius: 8px;
			margin-top: 1rem;
			font-size: 0.9rem;
		}

		.error-message {
			background: rgba(255, 107, 107, 0.1);
			border: 1px solid rgba(255, 107, 107, 0.3);
			color: #ff6b6b;
		}

		.success-message {
			background: rgba(100, 255, 218, 0.1);
			border: 1px solid rgba(100, 255, 218, 0.3);
			color: #64ffda;
		}

		/* レスポンシブデザイン */
		@media (max-width: 768px) {
			.header-content {
				padding: 0 1rem;
			}

			.main-content {
				padding: 1rem;
			}

			.login-card {
				padding: 2rem;
				margin: 1rem;
			}

			.menu-grid {
				grid-template-columns: 1fr;
			}

			.hamburger-menu {
				display: block;
			}
		}

		@media (max-width: 480px) {
			.login-card {
				padding: 1.5rem;
			}

			.menu-card {
				padding: 1.5rem;
			}

			.btn {
				font-size: 0.9rem;
				padding: 0.6rem 1.2rem;
			}
		}

		/* スクロールバー */
		::-webkit-scrollbar {
			width: 8px;
		}

		::-webkit-scrollbar-track {
			background: rgba(255, 255, 255, 0.05);
		}

		::-webkit-scrollbar-thumb {
			background: rgba(255, 255, 255, 0.2);
			border-radius: 4px;
		}

		::-webkit-scrollbar-thumb:hover {
			background: rgba(255, 255, 255, 0.3);
		}

		/* フォーカス */
		*:focus {
			outline: none;
		}
		#loginForm, #mainContent {
			display: none;
		}
		#loadingSpinner {
			display: flex;
			justify-content: center;
			align-items: center;
			min-height: 100vh;
			font-size: 2rem;
			color: #64ffda;
			background: transparent;
			z-index: 2000;
		}
	</style>
</head>

<body>
	<!-- ヘッダー -->
	<header class="header">
		<div class="header-content">
			<a href="/index.html" class="home-link">
				<i class="fas fa-home"></i>
				<span>HOME-SERVER</span>
			</a>
			<div class="header-info">
				<div id="userInfo" class="title"></div>
				<div class="counter">ホーム画面</div>
			</div>
			<!-- ハンバーガーメニュー -->
			<div class="hamburger-menu" id="hamburgerMenu" style="display: none;">
				<button class="hamburger-btn" onclick="toggleHamburger()">
					<i class="fas fa-bars"></i>
				</button>
				<div class="hamburger-content" id="hamburgerContent">
					<a href="/user_register.html" class="hamburger-item">
						<i class="fas fa-users"></i>
						ユーザー管理
					</a>
					<button class="hamburger-item logout" onclick="logout()">
						<i class="fas fa-sign-out-alt"></i>
						ログアウト
					</button>
				</div>
			</div>
		</div>
	</header>

	<!-- メインコンテンツ -->
	<main class="main-content">
		<div id="loadingSpinner">
			<i class="fas fa-spinner fa-spin"></i> 認証確認中...
		</div>
		<!-- ログインフォーム -->
		<div id="loginForm" class="login-section">
			<div class="login-card">
				<h2 id="loginTitle">HOME-SERVER ログイン</h2>
				<form id="loginFormElement" method="post" action="javascript:void(0);" onsubmit="login(); return false;">
					<div class="input-group">
						<label for="usernameInput">ユーザー名</label>
						<input 
							type="text" 
							id="usernameInput" 
							name="username"
							class="modern-input"
							autocomplete="username"
							placeholder="ユーザー名を入力してください" 
							required
						>
					</div>
					<div class="input-group">
						<label for="passwordInput">パスワード</label>
						<input 
							type="password" 
							id="passwordInput" 
							name="password"
							class="modern-input"
							autocomplete="current-password"
							placeholder="パスワードを入力してください" 
							onkeypress="handleKeyPress(event)"
							required
						>
					</div>
					<div class="input-group" id="registerFields" style="display:none;">
						<label for="passwordInput2">パスワード（確認）</label>
						<input 
							type="password" 
							id="passwordInput2" 
							name="password2"
							class="modern-input"
							autocomplete="new-password"
							placeholder="もう一度パスワードを入力してください" 
						>
					</div>
					<button type="submit" id="loginButton" class="btn btn-primary">
						<i class="fas fa-sign-in-alt"></i>
						ログイン
					</button>
				</form>
				<div id="loginMessage"></div>
			</div>
		</div>

		<!-- メインコンテンツ表示 -->
		<div id="mainContent" class="main-display">
			<!-- ウェルカムセクション -->
			<section class="welcome-section">
				<div class="welcome-card">
					<h2><i class="fas fa-home"></i> ホーム</h2>
					<p>HOME-SERVERの管理画面です。左側のメニューから各機能にアクセスできます。</p>
				</div>
			</section>

			<!-- メニューセクション -->
			<section class="menu-section">
				<div class="menu-grid">
					<a href="/viewer.html" class="menu-card">
						<h3><i class="fas fa-images"></i> Viewer</h3>
						<p>画像やファイルを閲覧・管理します。メタデータの編集や検索機能も利用できます。</p>
					</a>
					<a href="/memo.html" class="menu-card">
						<h3><i class="fas fa-sticky-note"></i> Memo</h3>
						<p>メモの作成・編集・管理を行います。アイデアやタスクを記録しましょう。</p>
					</a>
				</div>
			</section>
		</div>
	</main>

	<script>
	let token = localStorage.getItem('token');
	let username = localStorage.getItem('username');
	let isFirstUser = false;

	window.onload = async function() {
		document.getElementById('loadingSpinner').style.display = 'flex';
		document.getElementById('loginForm').style.display = 'none';
		document.getElementById('mainContent').style.display = 'none';
		const first = await checkFirstUser();
		if (token) {
			await checkAuth();
		} else {
			showLoginForm(first);
		}
		document.getElementById('loadingSpinner').style.display = 'none';
	};

	// ハンバーガーメニューの切り替え
	function toggleHamburger() {
		const content = document.getElementById('hamburgerContent');
		content.classList.toggle('show');
	}

	// ハンバーガーメニューを外側クリックで閉じる
	document.addEventListener('click', function(event) {
		const hamburgerMenu = document.getElementById('hamburgerMenu');
		const hamburgerContent = document.getElementById('hamburgerContent');
		
		if (hamburgerMenu && !hamburgerMenu.contains(event.target)) {
			hamburgerContent.classList.remove('show');
		}
	});

	async function checkFirstUser() {
		try {
			const res = await fetch('/req/user/check_first');
			const data = await res.json();
			isFirstUser = data.success && data.is_first_user;
			return isFirstUser;
		} catch (e) {
			isFirstUser = false;
			return false;
		}
	}

	function showLoginForm(first) {
		document.getElementById('loadingSpinner').style.display = 'none';
		document.getElementById('loginForm').style.display = 'flex';
		document.getElementById('mainContent').style.display = 'none';
		document.getElementById('hamburgerMenu').style.display = 'none';
		document.getElementById('usernameInput').value = '';
		document.getElementById('passwordInput').value = '';
		document.getElementById('loginMessage').innerHTML = '';
		if (first) {
			document.getElementById('loginTitle').innerText = '管理者アカウント新規作成';
			document.getElementById('registerFields').style.display = 'block';
			document.getElementById('loginButton').innerHTML = '<i class="fas fa-user-plus"></i> 管理者登録';
		} else {
			document.getElementById('loginTitle').innerText = 'HOME-SERVER ログイン';
			document.getElementById('registerFields').style.display = 'none';
			document.getElementById('loginButton').innerHTML = '<i class="fas fa-sign-in-alt"></i> ログイン';
		}
	}

	function handleKeyPress(event) {
		if (event.key === 'Enter') {
			login();
		}
	}

	async function login() {
		const inputUsername = document.getElementById('usernameInput').value;
		const inputPassword = document.getElementById('passwordInput').value;
		const messageDiv = document.getElementById('loginMessage');
		if (!inputUsername || !inputPassword) {
			messageDiv.innerHTML = '<div class="message error-message">ユーザー名とパスワードを入力してください</div>';
			return;
		}
		if (isFirstUser) {
			const inputPassword2 = document.getElementById('passwordInput2').value;
			if (inputPassword !== inputPassword2) {
				messageDiv.innerHTML = '<div class="message error-message">パスワードが一致しません</div>';
				return;
			}
			// 管理者登録API
			try {
				const res = await fetch('/req/user/register', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ username: inputUsername, password: inputPassword, role: 'admin', created_by: '' })
				});
				const data = await res.json();
				if (data.success) {
					messageDiv.innerHTML = '<div class="message success-message">管理者アカウントを登録しました。自動ログインします。</div>';
					setTimeout(() => doAutoLogin(inputUsername, inputPassword), 1000);
				} else {
					messageDiv.innerHTML = '<div class="message error-message">' + data.message + '</div>';
				}
			} catch (e) {
				messageDiv.innerHTML = '<div class="message error-message">登録中にエラーが発生しました</div>';
			}
			return;
		}
		// 通常ログイン
		try {
			const response = await fetch('/req/auth/login', {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json'
				},
				body: JSON.stringify({ username: inputUsername, password: inputPassword })
			});
			const data = await response.json();
			if (data.success) {
				token = data.token;
				username = data.username;
				localStorage.setItem('token', token);
				localStorage.setItem('username', username);
				messageDiv.innerHTML = '<div class="message success-message">ログインに成功しました</div>';
				setTimeout(() => {
					showMainContent();
				}, 1000);
			} else {
				messageDiv.innerHTML = '<div class="message error-message">' + data.message + '</div>';
			}
		} catch (error) {
			messageDiv.innerHTML = '<div class="message error-message">ログイン中にエラーが発生しました</div>';
		}
	}

	async function doAutoLogin(user, pass) {
		const messageDiv = document.getElementById('loginMessage');
		try {
			const response = await fetch('/req/auth/login', {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({ username: user, password: pass })
			});
			const data = await response.json();
			if (data.success) {
				token = data.token;
				username = data.username;
				localStorage.setItem('token', token);
				localStorage.setItem('username', username);
				showMainContent();
			} else {
				messageDiv.innerHTML = '<div class="message error-message">自動ログインに失敗しました: ' + data.message + '</div>';
			}
		} catch (e) {
			messageDiv.innerHTML = '<div class="message error-message">自動ログイン中にエラーが発生しました</div>';
		}
	}

	// 認証チェック
	async function checkAuth() {
		try {
			const response = await fetch('/req/auth/check', {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json'
				},
				body: JSON.stringify({ token: token })
			});

			const data = await response.json();

			if (data.authenticated) {
				username = data.username || username;
				localStorage.setItem('username', username);
				showMainContent();
			} else {
				localStorage.removeItem('token');
				localStorage.removeItem('username');
				token = null;
				username = null;
				showLoginForm();
			}
		} catch (error) {
			localStorage.removeItem('token');
			localStorage.removeItem('username');
			token = null;
			username = null;
			showLoginForm();
		}
	}

	// ログアウト処理
	async function logout() {
		try {
			await fetch('/req/auth/logout', {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json'
				},
				body: JSON.stringify({ token: token })
			});
		} catch (error) {
			// エラーは無視
		}
		
		localStorage.removeItem('token');
		localStorage.removeItem('username');
		token = null;
		username = null;
		showLoginForm();
	}

	// メインコンテンツ表示
	function showMainContent() {
		document.getElementById('loadingSpinner').style.display = 'none';
		document.getElementById('loginForm').style.display = 'none';
		document.getElementById('mainContent').style.display = 'block';
		document.getElementById('hamburgerMenu').style.display = 'block';
		
		// ユーザー情報表示
		const userInfoDiv = document.getElementById('userInfo');
		if (username) {
