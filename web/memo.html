<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>メモ管理</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
	<link rel="stylesheet" href="/src/frontend/common.css" type="text/css">
	<link rel="stylesheet" href="/src/frontend/common_mobile.css" type="text/css" media="(max-width: 768px)">
	<link rel="stylesheet" href="/src/frontend/memo/style.css" type="text/css">
	<link rel="stylesheet" href="/src/frontend/memo/mobile.css" type="text/css" media="(max-width: 768px)">
</head>
<body>
	<!-- ヘッダー -->
	<header class="header">
		<div class="header-content">
			<a href="/web/index.html" class="home-link">
				<i class="fas fa-home"></i>
				<span>HOME</span>
			</a>
			<div class="header-info">
				<h1 class="title">メモ管理</h1>
				<div class="counter" id="memoCounter">0</div>
			</div>
		</div>
	</header>

	<!-- メインコンテンツ -->
	<main class="main-content">
		<!-- 検索セクション -->
		<section class="search-section">
			<div class="search-card">
				<h3><i class="fas fa-search"></i> メモ検索</h3>
				<p class="section-description">タイトル、タグ、内容で検索できます。複数の単語を入力するとAND検索になります。</p>
				<div class="search-input-container">
					<input type="text" id="searchInput" class="search-input" placeholder="検索キーワードを入力...">
					<button class="btn btn-secondary" onclick="search_memos()">
						<i class="fas fa-search"></i>
						検索
					</button>
				</div>
			</div>
		</section>

		<!-- 新規作成セクション -->
		<section class="create-section">
			<div class="create-card">
				<h3><i class="fas fa-plus-circle"></i> 新規メモ作成</h3>
				<p class="section-description">新しいメモを作成して、アイデアやタスクを記録しましょう。タグを付けることで整理しやすくなります。</p>
				<button class="btn btn-primary" onclick="new_memo()">
					<i class="fas fa-plus"></i>
					新規作成
				</button>
			</div>
		</section>

		<!-- メモ一覧セクション -->
		<section class="memo-section">
			<h3><i class="fas fa-sticky-note"></i> メモ一覧</h3>
			<div id="memoList" class="memo-container">
				<!-- メモが動的にここに追加されます -->
			</div>
		</section>
	</main>

	<script src="/src/frontend/common.js"></script>
	<script src="/src/frontend/memo/script.js"></script>
</body>
</html>
