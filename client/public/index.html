<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=1024, user-scalable=no">
	<title>HOME-SERVER</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
	<link rel="stylesheet" href="/static/common.css">
	<link rel="stylesheet" href="/static/index/style.css">
</head>

<body>
	<!-- ヘッダー -->
	<header class="header">
		<div class="header-content">
			<a href="/index.html" class="home-link">
				<i class="fas fa-home"></i>
				<span>HOME-SERVER</span>
			</a>
			<div class="header-info">
				<div id="userInfo" class="title"></div>
				<div class="counter">ホーム画面</div>
			</div>
			<!-- ハンバーガーメニュー -->
			<div class="hamburger-menu" id="hamburgerMenu" style="display: none;">
				<button class="hamburger-btn" onclick="toggleHamburger()">
					<i class="fas fa-bars"></i>
				</button>
				<div class="hamburger-content" id="hamburgerContent">
					<a href="/user_register.html" class="hamburger-item">
						<i class="fas fa-users"></i>
						ユーザー管理
					</a>
					<button class="hamburger-item logout" onclick="logout()">
						<i class="fas fa-sign-out-alt"></i>
						ログアウト
					</button>
				</div>
			</div>
		</div>
	</header>

	<!-- メインコンテンツ -->
	<main class="main-content">
		<div id="loadingSpinner">
			<i class="fas fa-spinner fa-spin"></i> 認証確認中...
		</div>
		<!-- ログインフォーム -->
		<div id="loginForm" class="login-section">
			<div class="login-card">
				<h2 id="loginTitle">HOME-SERVER ログイン</h2>
				<form id="loginFormElement" method="post" action="javascript:void(0);" onsubmit="login(); return false;">
					<div class="input-group">
						<label for="usernameInput">ユーザー名</label>
						<input 
							type="text" 
							id="usernameInput" 
							name="username"
							class="modern-input"
							autocomplete="username"
							placeholder="ユーザー名を入力してください" 
							required
						>
					</div>
					<div class="input-group">
						<label for="passwordInput">パスワード</label>
						<input 
							type="password" 
							id="passwordInput" 
							name="password"
							class="modern-input"
							autocomplete="current-password"
							placeholder="パスワードを入力してください" 
							onkeypress="handleKeyPress(event)"
							required
						>
					</div>
					<div class="input-group" id="registerFields" style="display:none;">
						<label for="passwordInput2">パスワード（確認）</label>
						<input 
							type="password" 
							id="passwordInput2" 
							name="password2"
							class="modern-input"
							autocomplete="new-password"
							placeholder="もう一度パスワードを入力してください" 
						>
					</div>
					<button type="submit" id="loginButton" class="btn btn-primary">
						<i class="fas fa-sign-in-alt"></i>
						ログイン
					</button>
				</form>
				<div id="loginMessage"></div>
			</div>
		</div>

		<!-- メインコンテンツ表示 -->
		<div id="mainContent" class="main-display">
			<!-- ウェルカムセクション -->
			<section class="welcome-section">
				<div class="welcome-card">
					<h2><i class="fas fa-home"></i> ホーム</h2>
					<p>HOME-SERVERの管理画面です。左側のメニューから各機能にアクセスできます。</p>
				</div>
			</section>

			<!-- メニューセクション -->
			<section class="menu-section">
				<div class="menu-grid">
					<a href="/viewer.html" class="menu-card">
						<h3><i class="fas fa-images"></i> Viewer</h3>
						<p>画像やファイルを閲覧・管理します。メタデータの編集や検索機能も利用できます。</p>
					</a>
					<a href="/memo.html" class="menu-card">
						<h3><i class="fas fa-sticky-note"></i> Memo</h3>
						<p>メモの作成・編集・管理を行います。アイデアやタスクを記録しましょう。</p>
					</a>
				</div>
			</section>
		</div>
	</main>

	<script type="module" src="/static/index/main.js"></script>
</body>
</html>
