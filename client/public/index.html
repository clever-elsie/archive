<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
	<title>HOME-SERVER</title>
	<link rel="stylesheet" href="/static/common.css">
	<link rel="stylesheet" href="/static/index/style.css">
</head>

<body>
	<!-- ヘッダー -->
	<header class="header">
		<div class="header-content">
			<a href="/index.html" class="home-link">
				<span aria-hidden="true">⌂</span>
				<span>HOME-SERVER</span>
			</a>
			<div class="header-info">
				<div id="userInfo" class="title"></div>
				<div class="counter">ホーム画面</div>
			</div>
			<!-- ハンバーガーメニュー -->
			<div class="hamburger-menu hidden" id="hamburgerMenu">
				<button id="hamburgerButton" class="hamburger-btn" type="button" aria-label="メニュー">☰</button>
				<div class="hamburger-content" id="hamburgerContent">
					<a href="/user_register.html" id="adminLink" class="hamburger-item" hidden>
						ユーザー管理
					</a>
					<button id="logoutButton" class="hamburger-item logout" type="button">ログアウト</button>
				</div>
			</div>
		</div>
	</header>

	<!-- メインコンテンツ -->
	<main class="main-content">
		<div id="loadingSpinner">
			認証確認中…
		</div>
		<!-- ログインフォーム -->
		<div id="loginForm" class="login-section hidden">
			<div class="login-card">
				<h2 id="loginTitle">HOME-SERVER ログイン</h2>
				<form id="loginFormElement" method="post">
					<div class="input-group">
						<label for="usernameInput">ユーザー名</label>
						<input
							type="text"
							id="usernameInput"
							name="username"
							class="modern-input"
							autocomplete="username"
							pattern="[A-Za-z0-9]{1,32}"
							placeholder="ユーザー名を入力してください"
							required
						>
					</div>
					<div class="input-group">
						<label for="passwordInput">パスワード</label>
						<input 
							type="password" 
							id="passwordInput" 
							name="password"
							class="modern-input"
							autocomplete="current-password"
							pattern="[A-Za-z0-9_-]{10,64}"
							placeholder="パスワードを入力してください"
							required
						>
					</div>
					<div class="input-group hidden" id="registerFields">
						<label for="passwordInput2">パスワード（確認）</label>
						<input 
							type="password" 
							id="passwordInput2" 
							name="password2"
							class="modern-input"
							autocomplete="new-password"
							pattern="[A-Za-z0-9_-]{10,64}"
							placeholder="もう一度パスワードを入力してください"
						>
						<p class="form-help">
							ユーザー名は1〜32文字の半角英数字のみ使用できます。<br>
							パスワードは10〜64文字で、半角英数字・アンダーバー（_）・ハイフン（-）のみ使用できます。
						</p>
					</div>
					<button type="submit" id="loginButton" class="btn btn-primary">ログイン</button>
				</form>
				<div id="loginMessage"></div>
			</div>
		</div>

		<!-- メインコンテンツ表示 -->
		<div id="mainContent" class="main-display hidden">
			<!-- ウェルカムセクション -->
			<section class="welcome-section">
				<div class="welcome-card">
					<h2>ホーム</h2>
					<p>HOME-SERVERの管理画面です。左側のメニューから各機能にアクセスできます。</p>
				</div>
			</section>

			<!-- メニューセクション -->
			<section class="menu-section">
				<div class="menu-grid">
					<a href="/viewer.html" class="menu-card">
						<h3>Viewer</h3>
						<p>画像やファイルを閲覧・管理します。メタデータの編集や検索機能も利用できます。</p>
					</a>
					<a href="/memo.html" class="menu-card">
						<h3>Memo</h3>
						<p>メモの作成・編集・管理を行います。アイデアやタスクを記録しましょう。</p>
					</a>
				</div>
			</section>
		</div>
	</main>

	<script type="module" src="/static/index/main.js"></script>
</body>
</html>
