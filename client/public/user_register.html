<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1024, user-scalable=no">
    <title>ユーザー管理システム</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            color: #ffffff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 600;
            color: #64ffda;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: #8892b0;
            font-size: 1.1rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            margin-bottom: 2rem;
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.2);
        }

        .card h2 {
            color: #64ffda;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #ffffff;
            font-weight: 500;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #64ffda;
            box-shadow: 0 0 0 3px rgba(100, 255, 218, 0.1);
        }

        .form-group input::placeholder {
            color: #8892b0;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            color: #ffffff;
            min-height: 48px;
            justify-content: center;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .btn-primary {
            background: linear-gradient(135deg, #64ffda 0%, #00d4aa 100%);
            color: #0f0f23;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8e53 100%);
            color: #ffffff;
        }

        .btn-warning {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            color: #0f0f23;
        }

        .btn-success {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: #ffffff;
        }

        .message {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .message.success {
            background: rgba(100, 255, 218, 0.2);
            border: 1px solid rgba(100, 255, 218, 0.3);
            color: #64ffda;
        }

        .message.error {
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid rgba(255, 107, 107, 0.3);
            color: #ff6b6b;
        }

        .user-list {
            display: grid;
            gap: 1rem;
        }

        .user-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-info {
            flex: 1;
        }

        .user-name {
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 0.25rem;
        }

        .user-role {
            color: #8892b0;
            font-size: 0.9rem;
        }

        .user-actions {
            display: flex;
            gap: 0.5rem;
        }

        .hidden {
            display: none;
        }

        .home-link {
            position: fixed;
            top: 2rem;
            left: 2rem;
            color: #64ffda;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
        }

        .home-link:hover {
            color: #00d4aa;
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            
            .user-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
            
            .user-actions {
                width: 100%;
                justify-content: flex-end;
            }
        }
        option {
            color: black;
        }
    </style>
</head>
<body>
    <a href="/index.html" class="home-link">
        <i class="fas fa-home"></i>
        <span>HOME</span>
    </a>

    <div class="container">
        <div class="header">
            <h1><i class="fas fa-users-cog"></i> ユーザー管理システム</h1>
            <p>ユーザーの登録、削除、権限管理を行います</p>
        </div>

        <!-- ログインセクション -->
        <div id="loginSection" class="card">
            <h2><i class="fas fa-sign-in-alt"></i> ログイン</h2>
            <div id="loginMessage"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginUsername">ユーザー名</label>
                    <input type="text" id="loginUsername" required pattern="^[A-Za-z0-9]{1,32}$" minlength="1" maxlength="32" title="ユーザー名は1〜32文字の英数字のみ">
                </div>
                <div class="form-group">
                    <label for="loginPassword">パスワード</label>
                    <input type="password" id="loginPassword" required pattern="^[A-Za-z0-9_-]{10,64}$" minlength="10" maxlength="64" title="パスワードは10〜64文字の英数字・アンダーバー・ハイフンのみ">
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-sign-in-alt"></i> ログイン
                </button>
            </form>
        </div>

        <!-- メインセクション -->
        <div id="mainSection" class="hidden">
            <div class="card">
                <h2><i class="fas fa-user-plus"></i> 新規ユーザー登録</h2>
                <div id="registerMessage"></div>
                <form id="registerForm">
                    <div class="form-group">
                        <label for="newUsername">ユーザー名</label>
                        <input type="text" id="newUsername" required pattern="^[A-Za-z0-9]{1,32}$" minlength="1" maxlength="32" title="ユーザー名は1〜32文字の英数字のみ">
                    </div>
                    <div class="form-group">
                        <label for="newPassword">パスワード</label>
                        <input type="password" id="newPassword" required pattern="^[A-Za-z0-9_-]{10,64}$" minlength="10" maxlength="64" title="パスワードは10〜64文字の英数字・アンダーバー・ハイフンのみ">
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">パスワード（確認）</label>
                        <input type="password" id="confirmPassword" required pattern="^[A-Za-z0-9_-]{10,64}$" minlength="10" maxlength="64" title="パスワードは10〜64文字の英数字・アンダーバー・ハイフンのみ">
                    </div>
                    <div class="form-group">
                        <label for="userRole">権限</label>
                        <select id="userRole" required>
                            <option value="user">一般ユーザー</option>
                            <option value="admin">管理者</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-user-plus"></i> 登録
                    </button>
                </form>
            </div>

            <div class="card">
                <h2><i class="fas fa-user-edit"></i> 権限操作</h2>
                <div id="permissionMessage"></div>
                <form id="permissionForm">
                    <div class="form-group">
                        <label for="targetUsername">対象ユーザー名</label>
                        <input type="text" id="targetUsername" required>
                    </div>
                    <div class="form-group">
                        <label for="permissionAction">操作</label>
                        <select id="permissionAction" required>
                            <option value="promote">昇格（管理者にする）</option>
                            <option value="demote">降格（一般ユーザーにする）</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-warning">
                        <i class="fas fa-user-edit"></i> 実行
                    </button>
                </form>
            </div>

            <div class="card">
                <h2><i class="fas fa-user-minus"></i> ユーザー削除</h2>
                <div id="deleteMessage"></div>
                <form id="deleteForm">
                    <div class="form-group">
                        <label for="deleteUsername">削除するユーザー名</label>
                        <input type="text" id="deleteUsername" required>
                    </div>
                    <button type="submit" class="btn btn-danger">
                        <i class="fas fa-user-minus"></i> 削除
                    </button>
                </form>
            </div>

            <div class="card">
                <h2><i class="fas fa-list"></i> ユーザー一覧</h2>
                <div id="userListMessage"></div>
                <button onclick="loadUserList()" class="btn btn-secondary">
                    <i class="fas fa-sync-alt"></i> 更新
                </button>
                <div id="userList" class="user-list"></div>
            </div>
    </div>
    </div>

    <script type="module" src="/static/user_register/main.js"></script>
</body>
</html>
