<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>ユーザー管理 - HOME-SERVER</title>
    <link rel="stylesheet" href="/static/common.css">
    <link rel="stylesheet" href="/static/user_register/style.css">
</head>
<body>
    <header class="viewer-header">
        <a class="brand" href="/index.html">HOME-SERVER</a>
        <div class="header-title"><span class="ruby-label">ユーザー管理</span></div>
        <div class="header-actions">
            <span id="adminIdentity" class="header-counter"></span>
            <button id="logoutButton" class="button subtle" type="button">ログアウト</button>
        </div>
    </header>

    <main class="admin-page">
        <div id="adminStatus" class="admin-status" role="status">認証確認中…</div>

        <section id="loginSection" class="panel" hidden>
            <h1 id="loginTitle">ログイン</h1>
            <div id="loginMessage" class="message" role="status"></div>
            <form id="loginForm">
                <div class="form-grid">
                    <div class="field">
                        <label for="loginUsername">ユーザー名</label>
                        <input id="loginUsername" type="text" autocomplete="username" pattern="[A-Za-z0-9]{1,32}" required>
                    </div>
                    <div class="field">
                        <label for="loginPassword">パスワード</label>
                        <input id="loginPassword" type="password" autocomplete="current-password" pattern="[A-Za-z0-9_-]{10,64}" required>
                    </div>
                    <div id="initialPasswordConfirmation" class="field" hidden>
                        <label for="loginPasswordConfirmation">パスワード（確認）</label>
                        <input id="loginPasswordConfirmation" type="password" autocomplete="new-password" pattern="[A-Za-z0-9_-]{10,64}">
                    </div>
                </div>
                <p id="initialCredentialRules" class="form-help" hidden>
                    ユーザー名は1〜32文字の半角英数字のみ使用できます。<br>
                    パスワードは10〜64文字で、半角英数字・アンダーバー（_）・ハイフン（-）のみ使用できます。
                </p>
                <button class="button primary" type="submit" id="loginButton">ログイン</button>
            </form>
        </section>

        <section id="passwordSection" class="panel" hidden>
            <h2>パスワード変更</h2>
            <div id="passwordMessage" class="message" role="status"></div>
            <form id="passwordForm">
                <div class="form-grid">
                    <div class="field">
						<label for="changeCurrentPassword">現在のパスワード</label>
						<input id="changeCurrentPassword" type="password" autocomplete="current-password" pattern="[A-Za-z0-9_-]{10,64}" required>
                    </div>
                    <div class="field">
						<label for="changeNewPassword">新しいパスワード</label>
						<input id="changeNewPassword" type="password" autocomplete="new-password" pattern="[A-Za-z0-9_-]{10,64}" required>
                    </div>
                    <div class="field">
						<label for="changeNewPasswordConfirmation">新しいパスワード（確認）</label>
						<input id="changeNewPasswordConfirmation" type="password" autocomplete="new-password" pattern="[A-Za-z0-9_-]{10,64}" required>
                    </div>
                </div>
                <button class="button subtle" type="submit">変更してログイン画面へ</button>
            </form>
        </section>

        <div id="adminSections" hidden>
            <section class="panel">
                <h2>新規ユーザー登録</h2>
                <div id="registerMessage" class="message" role="status"></div>
                <form id="registerForm">
                    <div class="form-grid">
                        <div class="field">
                            <label for="newUsername">ユーザー名</label>
                            <input id="newUsername" type="text" pattern="[A-Za-z0-9]{1,32}" required>
                        </div>
                        <div class="field">
                            <label for="newPassword">パスワード</label>
                            <input id="newPassword" type="password" pattern="[A-Za-z0-9_-]{10,64}" required>
                        </div>
                        <div class="field">
                            <label for="confirmPassword">パスワード（確認）</label>
                            <input id="confirmPassword" type="password" pattern="[A-Za-z0-9_-]{10,64}" required>
                        </div>
                        <div class="field">
                            <label for="userRole">権限</label>
                            <select id="userRole" required>
                                <option value="user">一般ユーザー</option>
                                <option value="admin">管理者</option>
                            </select>
                        </div>
                    </div>
                    <p class="form-help">
                        ユーザー名は1〜32文字の半角英数字のみ使用できます。<br>
                        パスワードは10〜64文字で、半角英数字・アンダーバー（_）・ハイフン（-）のみ使用できます。
                    </p>
                    <button class="button primary" type="submit">登録</button>
                </form>
            </section>

            <section class="panel">
                <h2>権限操作</h2>
                <div id="permissionMessage" class="message" role="status"></div>
                <form id="permissionForm">
                    <div class="form-grid">
                        <div class="field">
                            <label for="targetUsername">対象ユーザー名</label>
                            <input id="targetUsername" type="text" pattern="[A-Za-z0-9]{1,32}" required>
                        </div>
                        <div class="field">
                            <label for="permissionAction">操作</label>
                            <select id="permissionAction">
                                <option value="promote">昇格（管理者にする）</option>
                                <option value="demote">降格（一般ユーザーにする）</option>
                            </select>
                        </div>
                    </div>
                    <button class="button subtle" type="submit">実行</button>
                </form>
            </section>

            <section class="panel">
                <h2>ユーザー削除</h2>
                <div id="deleteMessage" class="message" role="status"></div>
                <form id="deleteForm">
                    <div class="form-grid">
                        <div class="field">
                            <label for="deleteUsername">削除するユーザー名</label>
                            <input id="deleteUsername" type="text" pattern="[A-Za-z0-9]{1,32}" required>
                        </div>
                    </div>
                    <button class="button danger" type="submit">削除</button>
                </form>
            </section>

            <section class="panel">
                <div class="admin-toolbar">
                    <h2>ユーザー一覧</h2>
                    <button id="reloadUsersButton" class="button subtle" type="button">更新</button>
                </div>
                <div id="userListMessage" class="message" role="status"></div>
                <div id="userList" class="user-list"></div>
            </section>
        </div>
    </main>
	<script type="module" src="/static/user_register/main.js"></script>
</body>
</html>
