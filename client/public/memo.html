<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
	<title>メモ管理</title>
	<link rel="stylesheet" href="/static/common.css" type="text/css">
	<link rel="stylesheet" href="/static/memo/style.css" type="text/css">
</head>
<body>
	<!-- ヘッダー -->
	<header class="header">
		<div class="header-content">
			<a href="/index.html" class="home-link">
				<span aria-hidden="true">⌂</span>
				<span>HOME</span>
			</a>
			<div class="header-info">
				<h1 class="title">メモ管理</h1>
			</div>
			<button id="logoutButton" class="btn btn-secondary" type="button">ログアウト</button>
		</div>
	</header>

	<!-- メインレイアウト（VSCode風） -->
	<main class="memo-app">
		<div id="memoStatus" class="memo-status" role="status">認証確認中…</div>
		<aside class="memo-sidebar">
			<div class="sidebar-header">
				<div class="sidebar-memo-counter">
					<span class="counter-label">メモ数</span>
					<span class="counter-value" id="memoCounter">0</span>
				</div>
				<div class="search-input-container">
					<input type="text" id="searchInput" class="search-input" placeholder="検索キーワードを入力...">
					<button id="searchButton" class="btn btn-secondary" type="button" aria-label="検索">検索</button>
				</div>
				<div class="sidebar-actions">
					<button id="newMemoButton" class="btn btn-primary" type="button">新規</button>
					<button id="newSharedMemoButton" class="btn btn-secondary" type="button">共用</button>
				</div>
			</div>
			<div class="sidebar-tabs">
				<button id="personalTabButton" class="sidebar-tab active" type="button">個人メモ</button>
				<button id="sharedTabButton" class="sidebar-tab" type="button">共用メモ</button>
			</div>
			<div id="memoList" class="memo-list-vertical"></div>
			<div id="sharedMemoList" class="memo-list-vertical" hidden></div>
		</aside>

		<section class="memo-editor-pane">
			<div id="editorTabs" class="editor-tabs"></div>
			<div id="editorArea" class="editor-area"></div>
			<div class="memo-savebar" id="memoSavebar">
				<button id="saveActiveButton" class="btn btn-primary" type="button" title="現在表示中を保存 (Ctrl+S)">保存</button>
				<span class="savebar-status" id="memoSaveStatus">未選択</span>
			</div>
		</section>
	</main>

	<script type="module" src="/static/memo/main.js"></script>
</body>
</html>
